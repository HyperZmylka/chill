name: Build release installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload
        required: true
        default: v4.14.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node --test test/appearance.test.js test/discord-import.test.js test/stickers.test.js test/voice.test.js test/game-detect.test.js test/minigames.test.js

      - name: Build installer
        run: npm run dist -- --publish never

      - name: Upload installer to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag }}"
          $installer = Get-ChildItem dist -Filter 'Chill-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found' }
          gh release upload $tag $installer.FullName --clobber
