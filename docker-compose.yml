services:
  chill:
    build: .
    image: chill-web:4.15.0
    restart: unless-stopped
    ports:
      - "${CHILL_BIND_ADDRESS:-0.0.0.0}:${CHILL_HTTP_PORT:-47830}:47830"
    environment:
      PORT: 47830
      CHILL_HOST: 0.0.0.0
      CHILL_PUBLIC_WEB: "1"
      CHILL_DATA_DIR: /data
      CHILL_PUBLIC_URL: ${CHILL_PUBLIC_URL:?Ustaw CHILL_PUBLIC_URL w pliku .env}
    volumes:
      - chill-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:47830/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  chill-data:
